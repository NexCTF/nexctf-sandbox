[project]
name = "nexctf-sandbox"
version = "1.1.0"
description = "Sandboxed code execution for NexCTF, script checker and code runner via microsandbox microVMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NexCTF", email = "contact@nexctf.dev" }
]
keywords = ["nexctf", "ctf", "sandbox", "microvm", "plugin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]
requires-python = ">=3.15"
dependencies = [
    "microsandbox>=0.7.11",
    "nexctf>=0.12.5,<0.13",
]

[project.urls]
Homepage = "https://github.com/NexCTF/nexctf-sandbox"
Repository = "https://github.com/NexCTF/nexctf-sandbox"
Issues = "https://github.com/NexCTF/nexctf-sandbox/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "nexctf @ git+https://github.com/NexCTF/NexCTF.git@v0.12.5#subdirectory=backend",
]

[project.entry-points."nexctf.plugins"]
nexctf_sandbox = "nexctf_sandbox"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: boots a real microVM, needs /dev/kvm",
]
addopts = "-m 'not live'"  # opt in with: pytest -m live
