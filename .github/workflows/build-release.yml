name: Build Package

on:
  release:
    types: [published]

jobs:
  build-package:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: false

      - name: Check the tag matches the package version
        run: |
          VERSION=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
